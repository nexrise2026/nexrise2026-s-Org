<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background Gradient: Deep Royal Plum -->
    <linearGradient id="plumBg" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A1566"/>
      <stop offset="50%" stop-color="#350E4A"/>
      <stop offset="100%" stop-color="#240733"/>
    </linearGradient>

    <!-- Accent Gradient: Radiant Violet & Orchid -->
    <linearGradient id="violetGlow" x1="60" y1="40" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <!-- Warm Amber / Gold Gradient for Navigational Spark -->
    <linearGradient id="goldAccent" x1="100" y1="50" x2="190" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="ambientLight" cx="120" cy="70" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#350E4A" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Drop Glow -->
  <rect x="16" y="16" width="208" height="208" rx="48" fill="url(#plumBg)"/>
  <rect x="16" y="16" width="208" height="208" rx="48" fill="url(#ambientLight)"/>
  <rect x="16" y="16" width="208" height="208" rx="48" stroke="url(#violetGlow)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Inner Soft Ring -->
  <circle cx="120" cy="120" r="76" stroke="#9333EA" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6"/>

  <!-- Stylized Emblem: Dynamic Intertwined Geometric 'N' & Compass Star -->
  <!-- Left Pillar of 'N' -->
  <path d="M72 166V78C72 74.6863 74.6863 72 78 72H88C91.3137 72 94 74.6863 94 78V166C94 169.314 91.3137 172 88 172H78C74.6863 172 72 169.314 72 166Z" fill="url(#violetGlow)"/>

  <!-- Right Pillar of 'N' -->
  <path d="M146 166V78C146 74.6863 148.686 72 152 72H162C165.314 72 168 74.6863 168 78V166C168 169.314 165.314 172 162 172H152C148.686 172 146 169.314 146 166Z" fill="url(#violetGlow)"/>

  <!-- Dynamic Diagonal Bridge with Origami Intersection -->
  <path d="M77 74L163 166C165.2 168.4 168 166.8 168 163.5V148L92 68C89.5 65.5 86 67 86 70.5V74H77Z" fill="url(#goldAccent)"/>

  <!-- Glowing Navigational Star Diamond at Top Right -->
  <g transform="translate(162, 74)">
    <path d="M0 -14L3.8 -3.8L14 0L3.8 3.8L0 14L-3.8 3.8L-14 0L-3.8 -3.8Z" fill="url(#goldAccent)" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Central Intelligence Core Node -->
  <circle cx="120" cy="120" r="5.5" fill="#FFFFFF" filter="url(#softGlow)"/>
  <circle cx="120" cy="120" r="8" stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
